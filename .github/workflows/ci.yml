name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  build-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test
        env:
          NODE_ENV: test
          FRONTEND_URL: http://localhost:5173
          SMTP_HOST: smtp.gmail.com
          SMTP_PORT: '465'
          SMTP_USER: test@example.com
          SMTP_APP_PASSWORD: test_password
          CONTACT_TO_EMAIL: owner@example.com
